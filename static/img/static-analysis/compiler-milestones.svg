    <text x="956" y="158" font-size="14" font-weight="400" fill="#4e5548">死代码消除</text>
    <text x="956" y="180" font-size="14" font-weight="400" fill="#4e5548">公共子表达式消除</text>

    <rect x="940" y="212" width="8" height="8" fill="#3f523b"/>
    <text x="956" y="221">1991年代表性工作</text>
    <text x="956" y="248" font-size="14" font-weight="400" fill="#4e5548">SSA 构建与控制依赖图</text>
    <text x="956" y="270" font-size="14" font-weight="400" fill="#4e5548">变量单次赋值原则</text>
