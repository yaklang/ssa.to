<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Noto Sans CJK SC, Source Han Sans SC, WenQuanYi Zen Hei, Noto Sans SC, sans-serif">
  <rect width="1200" height="640" fill="#f8f6ef"/>
  <text x="48" y="58" font-size="28" font-weight="700" fill="#1e241c">三种扫描模式</text>
  <text x="48" y="90" font-size="16" fill="#4e5548">柱高是分析深度。越深越慢，三种可以叠在同一次 code-scan 里。</text>
  <line x1="48" y1="112" x2="1152" y2="112" stroke="#d7dacd"/>
  <text x="1152" y="52" font-size="13" fill="#5c6156" text-anchor="end">浅 → 深</text>

  <line x1="72" y1="168" x2="1152" y2="168" stroke="#e3e6da" stroke-dasharray="4 6"/>
  <text x="60" y="172" font-size="12" fill="#6a7164" text-anchor="end">仓库</text>
  <line x1="72" y1="268" x2="1152" y2="268" stroke="#e3e6da" stroke-dasharray="4 6"/>
  <text x="60" y="272" font-size="12" fill="#6a7164" text-anchor="end">包内</text>
  <line x1="72" y1="368" x2="1152" y2="368" stroke="#c5cbbd" stroke-width="1.4"/>
  <text x="60" y="372" font-size="12" fill="#6a7164" text-anchor="end">文本</text>

  <rect x="120" y="248" width="280" height="120" fill="#52684c"/>
  <text x="144" y="292" font-size="22" font-weight="700" fill="#f8f6ef">source</text>
  <text x="144" y="320" font-size="15" fill="#e7eee2">源码检测 · 不编译</text>
  <text x="144" y="348" font-size="14" fill="#d5e0cc">密钥、危险配置、明显写法</text>

  <rect x="460" y="168" width="280" height="200" fill="#2a6f68"/>
  <text x="484" y="212" font-size="22" font-weight="700" fill="#f8f6ef">struct</text>
  <text x="484" y="240" font-size="15" fill="#e4f1ef">结构检测 · 编译单元刚完成</text>
  <text x="484" y="272" font-size="14" fill="#d4e6e3">包内危险调用</text>
  <text x="484" y="296" font-size="14" fill="#d4e6e3">不安全的语言结构</text>

  <rect x="800" y="88" width="280" height="280" fill="#5c5278"/>
  <text x="824" y="132" font-size="22" font-weight="700" fill="#f8f6ef">ssa</text>
  <text x="824" y="160" font-size="15" fill="#ece8f4">语义检测 · 全项目编译之后</text>
  <text x="824" y="196" font-size="14" fill="#ddd6ea">跨函数、跨包的数据流</text>
  <text x="824" y="220" font-size="14" fill="#ddd6ea">注入、污点链</text>

  <text x="120" y="412" font-size="13" fill="#5c6156">速度</text>
  <rect x="168" y="396" width="52" height="24" fill="#52684c"/>
  <text x="194" y="413" font-size="13" font-weight="700" fill="#f8f6ef" text-anchor="middle">快</text>
  <text x="460" y="412" font-size="13" fill="#5c6156">速度</text>
  <rect x="508" y="396" width="72" height="24" fill="#2a6f68"/>
  <text x="544" y="413" font-size="13" font-weight="700" fill="#f8f6ef" text-anchor="middle">中等</text>
  <text x="800" y="412" font-size="13" fill="#5c6156">速度</text>
  <rect x="848" y="396" width="52" height="24" fill="#5c5278"/>
  <text x="874" y="413" font-size="13" font-weight="700" fill="#f8f6ef" text-anchor="middle">慢</text>

  <text x="48" y="470" font-size="15" font-weight="700" fill="#1e241c">同一次扫描里的位置</text>
  <rect x="48" y="492" width="250" height="64" fill="#f3f1e7" stroke="#d7dacd"/>
  <text x="68" y="520" font-size="14" font-weight="700" fill="#52684c">inspect</text>
  <text x="68" y="540" font-size="13" fill="#3a4036">代码检测 · source</text>
  <rect x="330" y="492" width="250" height="64" fill="#f3f1e7" stroke="#d7dacd"/>
  <text x="350" y="520" font-size="14" font-weight="700" fill="#2a6f68">review</text>
  <text x="350" y="540" font-size="13" fill="#3a4036">语义检测 · struct</text>
  <rect x="612" y="492" width="250" height="64" fill="#f3f1e7" stroke="#d7dacd"/>
  <text x="632" y="520" font-size="14" font-weight="700" fill="#5c5278">analyze</text>
  <text x="632" y="540" font-size="13" fill="#3a4036">深度分析 · ssa</text>
  <rect x="894" y="492" width="258" height="64" fill="#eef0e4" stroke="#d7dacd"/>
  <text x="914" y="520" font-size="14" font-weight="700" fill="#1e241c">默认</text>
  <text x="914" y="540" font-size="13" fill="#3a4036">code-scan 三种都跑</text>

  <text x="48" y="604" font-size="13" fill="#5c6156">省略 desc 里的 mode 时按 ssa。只跑一部分用 --mode source 或重复该参数。</text>
</svg>
